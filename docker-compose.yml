services:
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: arbi-jacob-bot
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PORT: "3000"
      DB_PATH: /app/data/agent.db
      CATALOGUE_PATH: /app/data/catalogue.md
      # Chemins ABSOLUS obligatoires : le bot et le dashboard lisent et
      # écrivent les mêmes médias (reçus des clients, envoyés depuis le
      # back-office). Les défauts sont relatifs au répertoire courant, qui
      # diffère entre les deux services.
      MEDIA_DIR: /app/data/media
      DOCS_DIR: /app/data/documents
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: arbi-jacob-dashboard
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      PORT: "3001"
      DB_PATH: /app/data/agent.db
      CATALOGUE_PATH: /app/data/catalogue.md
      # Mêmes dossiers que le bot (cf. commentaire du service bot).
      MEDIA_DIR: /app/data/media
      DOCS_DIR: /app/data/documents
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy
